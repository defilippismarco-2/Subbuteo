<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b2e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Calcio da Tavolo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <button id="menuBtn" class="icon-btn" aria-label="Pausa">❚❚</button>
      <div class="score">
        <span class="team"><img id="f0" alt=""><span id="n0">ITA</span></span>
        <b id="s0">0</b><span class="dash">–</span><b id="s1">0</b>
        <span class="team"><span id="n1">BRA</span><img id="f1" alt=""></span>
      </div>
      <button id="soundBtn" class="icon-btn" aria-label="Audio">🔊</button>
    </header>

    <div id="strip1" class="strip" hidden></div>

    <main id="stage">
      <canvas id="c"></canvas>
      <div id="banner"></div>
    </main>

    <div id="strip0" class="strip" hidden></div>

    <footer id="status"><span id="statusText">&nbsp;</span><span id="shots"></span></footer>
  </div>

  <!-- Menu principale -->
  <section id="home" class="overlay show">
    <div class="card">
      <h1>Calcio<br><span>da Tavolo</span></h1>
      <p class="sub">Calcio a punta di dito, in verticale</p>
      <button id="homeCpu" class="primary">Amichevole</button>
      <button id="home2p">2 giocatori</button>
      <button id="homeTour">Torneo</button>
      <button id="homeContinue" hidden>Continua torneo</button>
      <button id="homeLegend" class="ghost">Legenda</button>
    </div>
  </section>

  <!-- Impostazioni partita -->
  <section id="setup" class="overlay">
    <div class="card wide">
      <h2 id="setupTitle">Amichevole</h2>
      <div id="teamPickers"></div>

      <div class="group">
        <label>Regole</label>
        <div class="seg" data-key="rules">
          <button data-v="classica">Classica</button>
          <button data-v="poteri">Con poteri</button>
        </div>
      </div>
      <div class="group" id="diffGroup">
        <label>Difficoltà CPU</label>
        <div class="seg" data-key="diff">
          <button data-v="facile">Facile</button>
          <button data-v="normale">Normale</button>
          <button data-v="difficile">Difficile</button>
        </div>
      </div>
      <div class="group">
        <label>Gol per vincere</label>
        <div class="seg" data-key="target">
          <button data-v="3">3</button>
          <button data-v="5">5</button>
          <button data-v="7">7</button>
        </div>
      </div>
      <div class="group">
        <label>Campo</label>
        <div id="fieldGrid" class="tiles"></div>
      </div>
      <div class="group">
        <label>Pallone</label>
        <div id="ballGrid" class="tiles balls"></div>
      </div>

      <button id="startBtn" class="primary">Gioca</button>
      <button id="setupBack" class="ghost">Indietro</button>
    </div>
  </section>

  <!-- Tabellone torneo -->
  <section id="bracket" class="overlay">
    <div class="card wide">
      <h2 id="bracketTitle">Torneo</h2>
      <div id="bracketBody"></div>
      <button id="bracketPlay" class="primary">Gioca</button>
      <button id="bracketMenu" class="ghost">Menu principale</button>
    </div>
  </section>

  <!-- Legenda -->
  <section id="legend" class="overlay">
    <div class="card wide legend">
      <div class="legend-head"><h2>Legenda</h2><button id="legendClose" class="icon-btn" aria-label="Chiudi">✕</button></div>
      <div id="legendBody"></div>
    </div>
  </section>

  <!-- Pausa -->
  <section id="pause" class="overlay">
    <div class="card">
      <h2>Pausa</h2>
      <button id="resumeBtn" class="primary">Riprendi</button>
      <button id="pauseLegend">Legenda</button>
      <button id="restartBtn">Ricomincia partita</button>
      <button id="quitBtn" class="ghost">Menu principale</button>
    </div>
  </section>

  <!-- Fine partita -->
  <section id="over" class="overlay">
    <div class="card">
      <h2 id="overTitle">Fine</h2>
      <p id="overScore" class="big"></p>
      <button id="againBtn" class="primary">Rivincita</button>
      <button id="overMenuBtn" class="ghost">Menu principale</button>
    </div>
  </section>

  <div id="rotate" class="overlay"><div class="card"><div class="phone">📱</div><p>Ruota il telefono in verticale per giocare</p></div></div>

  <script src="game.js"></script>
</body>
</html>
